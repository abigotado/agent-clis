[agents.coder]
description = "Implement scoped Go changes in agent-clis after planning."
prompt_file = "agents/coder.md"
claude_model = "sonnet"
claude_effort = "medium"
claude_tools = ["Read", "Grep", "Glob", "Edit", "Write", "Bash"]
codex_model = "gpt-5.6-terra"
codex_reasoning_effort = "medium"
read_only = false

[agents.test-writer]
description = "Add focused agent-clis table-driven unit tests and httptest boundary tests for changed behavior."
prompt_file = "agents/test-writer.md"
claude_model = "sonnet"
claude_effort = "medium"
claude_tools = ["Read", "Grep", "Glob", "Edit", "Write", "Bash"]
codex_model = "gpt-5.6-terra"
codex_reasoning_effort = "medium"
read_only = false

[agents.cli-contract-guardian]
description = "Validate agent-clis exit codes, JSON envelope, flag naming, and package dependency direction against silent breaking changes."
prompt_file = "agents/cli-contract-guardian.md"
claude_model = "sonnet"
claude_effort = "high"
claude_tools = ["Read", "Grep", "Glob", "Bash"]
codex_model = "gpt-5.6-terra"
