# Each role pins `claude_effort` to the level the operator's delegation table
# gives it, so a call that omits `effort` runs at that level rather than being
# refused. A pin is a fixed level, not a floor: a plan under the plan gate, a
# security or auth change, and a contract migration still pass `effort: xhigh`
# at spawn. No role caps its turns: a capped subagent stops without a report,
# and a reviewer stopped that way records no review.
#
# Only the orchestrator lists `Agent`. A Claude subagent cannot start another
# subagent, so the tool is useful only when the orchestrator is the main-thread
# agent (`claude --agent orchestrator`); Codex delegation depth comes from
# `providers/codex.toml`, not from this list.

[agents.orchestrator]
description = "Coordinate non-trivial agent-clis work through planning, advisory review, implementation, tests, review, and an independent second opinion."
prompt_file = "agents/orchestrator.md"
claude_model = "opus"
claude_effort = "high"
claude_tools = ["Read", "Grep", "Glob", "Bash", "Agent"]
codex_model = "gpt-5.6-sol"
codex_reasoning_effort = "high"
read_only = true

[agents.planner]
description = "Produce dependency-ordered agent-clis implementation plans without editing files."
prompt_file = "agents/planner.md"
claude_model = "opus"
claude_effort = "high"
claude_tools = ["Read", "Grep", "Glob", "Bash"]
codex_model = "gpt-5.6-sol"
codex_reasoning_effort = "high"
read_only = true

[agents.advisor]
description = "Read-only adversarial review of an agent-clis implementation plan before any code is written."
prompt_file = "agents/advisor.md"
claude_model = "opus"
claude_effort = "high"
claude_tools = ["Read", "Grep", "Glob", "Bash"]
codex_model = "gpt-5.6-sol"
codex_reasoning_effort = "high"
read_only = true

[agents.explorer]
description = "Trace agent-clis packages, commands, tests, and existing patterns with file and line evidence."
prompt_file = "agents/explorer.md"
claude_model = "haiku"
claude_effort = "medium"
claude_tools = ["Read", "Grep", "Glob", "Bash"]
codex_model = "gpt-5.6-terra"
codex_reasoning_effort = "medium"
