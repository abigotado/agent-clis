name = "claude"
config_dir = ".claude"
# settings.local.json belongs to the tool: it persists every "always allow"
# grant a developer approves. The compiler assigns the permission lists wholesale,
# so owning that file would delete those grants on each run. It owns
# settings.json instead, and the two are merged by the tool at load time.
settings_file = "settings.json"
instructions_file = "CLAUDE.md"
agent_dir = "agents"
hook_dir = "hooks"
default_mode = "auto"
skip_dangerous_mode_permission_prompt = false
python_command = "${AGENT_HARNESS_PYTHON:-python3}"
# The permission lists are committed and shared, so a rule that reads like
# protection but matches nothing (a `Write(...)` deny), a duplicate, or a Bash
# rule that means something different on Codex fails the compile.
validation = "strict"
# The repository tracks its own root CLAUDE.md (`@AGENTS.md`). The generated
# `.claude/CLAUDE.md` shim would resolve `@AGENTS.md` against `.claude/`, where
# no AGENTS.md exists, so it is omitted rather than shipped inert.
instruction_shim = false
