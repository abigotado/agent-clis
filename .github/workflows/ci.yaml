name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  changes:
    name: Select affected modules
    runs-on: ubuntu-latest
    outputs:
      youtrack: ${{ steps.select.outputs.youtrack }}
      all: ${{ steps.select.outputs.all }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select jobs from the changed paths
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/ci-changes.sh

  repo:
    name: Repository layout, workflows, and harness
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: youtrack-agent-cli/go.mod
          cache: true
          cache-dependency-path: youtrack-agent-cli/go.sum

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Pinned so a runner image bump cannot silently change the interpreter
          # the harness scripts run on.
          python-version: "3.12"

      # A Deprecated line on a current module would tell every consumer to
      # leave it. The old path carries one; the new paths must not.
      - name: No tracked module is deprecated
        run: |
          set -euo pipefail
          modules="$(git ls-files -- go.mod '*/go.mod')"
          test -n "${modules}"
          while IFS= read -r module; do
            deprecated="$(go mod edit -json "${module}" | jq -r '.Module.Deprecated // empty')"
            if [ -n "${deprecated}" ]; then
              echo "::error::${module} declares Deprecated: ${deprecated}"
              exit 1
            fi
          done <<<"${modules}"

      - name: Repository layout
        run: |
          set -euo pipefail
          test ! -e go.mod
          test -z "$(git ls-files -- go.work go.work.sum)"
          test -f docs/oauth-errors.md
          cmp LICENSE youtrack-agent-cli/LICENSE

      # Validate workflow expressions and every shell block. Pinned so an
      # unrelated pull request cannot turn red because a linter changed itself.
      - name: actionlint
        run: |
          set -euo pipefail
          # actionlint falls back to workflow-syntax-only when shellcheck is
          # missing, and reports success having checked no shell at all.
          # ubuntu-latest ships it; assert that rather than assume it, because
          # the failure mode is silent loss of coverage.
          if ! command -v shellcheck >/dev/null; then
            echo "::error::shellcheck is not installed; actionlint would skip every run: block"
            exit 1
          fi
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint

      - name: Release policy and change selection
        run: |
          set -euo pipefail
          ruby .github/scripts/verify-portable-release-policy_test.rb
          ruby .github/scripts/verify-portable-release-policy.rb youtrack-agent-cli/.goreleaser.yaml .
          ruby .github/scripts/ci-changes_test.rb

      - name: Generated mirrors must stay untracked
        run: |
          TRACKED=$(git ls-files .claude .codex)
          if [ -n "$TRACKED" ]; then
            echo "::error::Generated provider mirrors are committed. Remove them:"
            echo "$TRACKED"
            exit 1
          fi

      - name: Cursor mirrors are in sync
        run: python3 .agents/scripts/sync-rules.py --check

      - name: Harness unit tests
        run: python3 -m unittest discover -s .agents/tests -p 'test_*.py'

      # The provider compiler is not vendored — it lives in the machine-local
      # global harness, which a runner does not have. Compile determinism is
      # therefore a local pre-push check, not a CI check. What CI can still
      # enforce is that nobody vendored it back in without the duplication that
      # decision implies.
      - name: Provider compiler must stay unvendored
        run: |
          if [ -e .agents/scripts/compiler.py ]; then
            echo "::error::.agents/scripts/compiler.py is committed. The provider"
            echo "::error::compiler is intentionally the global ~/.agents one; see"
            echo "::error::.agents/README.md."
            exit 1
          fi

  youtrack:
    name: youtrack-agent-cli (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.youtrack == 'true' || needs.changes.outputs.all == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: youtrack-agent-cli
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: youtrack-agent-cli/go.mod
          cache: true
          cache-dependency-path: youtrack-agent-cli/go.sum

      - name: gofmt
        run: |
          UNFORMATTED=$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Verify module checksums
        run: go mod verify

      - name: Vulnerability scan
        if: runner.os == 'Linux'
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: go build
        run: go build ./...

      - name: Registry and receipt fixture provenance
        run: |
          go run ./testdata/gate1a-registry/generate.go -check
          go run ./testdata/gate1a-registry-intent/generate.go -check
          go run ./testdata/gate1a-registry-active/generate.go -check
          go run ./testdata/gate1a-registry-closed/generate.go -check
          go run ./testdata/gate1a-registry-time/generate.go -check
          go run ./testdata/gate1a-v3/generate.go -check

      - name: Darwin credential backend build modes
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go build -o "${RUNNER_TEMP}/youtrack-agent-cli-native" ./cmd/youtrack-agent-cli
          CGO_ENABLED=1 go list -f '{{join .CgoFiles "\n"}}' ./internal/auth \
            | grep -Fxq 'keychain_darwin.go'
          otool -L "${RUNNER_TEMP}/youtrack-agent-cli-native" | grep -Fq '/Security.framework/'
          if grep -aFq '/usr/bin/security' "${RUNNER_TEMP}/youtrack-agent-cli-native"; then
            echo "::error::native Darwin binary contains the forbidden security subprocess path"
            exit 1
          fi
          CGO_ENABLED=0 go build -o "${RUNNER_TEMP}/youtrack-agent-cli-unsupported" ./cmd/youtrack-agent-cli
          CGO_ENABLED=0 go list -f '{{join .GoFiles "\n"}}' ./internal/auth \
            | grep -Fxq 'keychain_unsupported.go'

      - name: macOS identity-only developer build modes
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          IDENTITY_TAG=macos_identity_readonly
          IDENTITY_BINARY="${RUNNER_TEMP}/youtrack-agent-cli-identity"
          CGO_ENABLED=1 go vet -tags "${IDENTITY_TAG}" \
            ./cmd/youtrack-agent-cli ./internal/readonlycli ./internal/skills ./assets ./internal/profile
          CGO_ENABLED=1 go test -race -tags "${IDENTITY_TAG}" \
            ./cmd/youtrack-agent-cli ./internal/readonlycli ./internal/skills ./assets ./internal/profile
          CGO_ENABLED=1 go build -tags "${IDENTITY_TAG}" -o "${IDENTITY_BINARY}" ./cmd/youtrack-agent-cli

          EXPECTED_OWNED_DEPS='github.com/abigotado/agent-clis/youtrack-agent-cli/assets
          github.com/abigotado/agent-clis/youtrack-agent-cli/cmd/youtrack-agent-cli
          github.com/abigotado/agent-clis/youtrack-agent-cli/internal/endpoint
          github.com/abigotado/agent-clis/youtrack-agent-cli/internal/errx
          github.com/abigotado/agent-clis/youtrack-agent-cli/internal/lockfile
          github.com/abigotado/agent-clis/youtrack-agent-cli/internal/output
          github.com/abigotado/agent-clis/youtrack-agent-cli/internal/profile
          github.com/abigotado/agent-clis/youtrack-agent-cli/internal/protocolvalue
          github.com/abigotado/agent-clis/youtrack-agent-cli/internal/readonlycli
          github.com/abigotado/agent-clis/youtrack-agent-cli/internal/skills'
          ACTUAL_OWNED_DEPS=$(go list -tags "${IDENTITY_TAG}" -deps ./cmd/youtrack-agent-cli \
            | grep '^github.com/abigotado/agent-clis/youtrack-agent-cli/' \
            | sort)
          if [ "${ACTUAL_OWNED_DEPS}" != "${EXPECTED_OWNED_DEPS}" ]; then
            echo "::error::identity owned dependency closure changed"
            printf 'expected:\n%s\nactual:\n%s\n' "${EXPECTED_OWNED_DEPS}" "${ACTUAL_OWNED_DEPS}"
            exit 1
          fi
          # Cobra/pflag transitively imports net for optional IP flag types,
          # even though this command never registers one. Forbid network
          # imports at the owned-package boundary so no identity package can
          # add transport capability through that dependency.
          for OWNED_PACKAGE in ${EXPECTED_OWNED_DEPS}; do
            for FORBIDDEN_IMPORT in net net/http crypto/tls; do
              if go list -tags "${IDENTITY_TAG}" -f '{{join .Imports "\n"}}' "${OWNED_PACKAGE}" | grep -Fxq "${FORBIDDEN_IMPORT}"; then
                echo "::error::identity package ${OWNED_PACKAGE} directly imports ${FORBIDDEN_IMPORT}"
                exit 1
              fi
            done
          done
          if otool -L "${IDENTITY_BINARY}" | grep -Fq '/Security.framework/'; then
            echo "::error::identity binary links Security.framework"
            exit 1
          fi
          if CGO_ENABLED=0 go build -tags "${IDENTITY_TAG}" ./cmd/youtrack-agent-cli; then
            echo "::error::identity tag built without Darwin cgo support"
            exit 1
          fi
          if CGO_ENABLED=1 go build -tags 'portable_readonly macos_identity_readonly' ./cmd/youtrack-agent-cli; then
            echo "::error::portable and identity tags built together"
            exit 1
          fi

      - name: Linux rejects macOS identity-only edition
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if CGO_ENABLED=1 go build -tags macos_identity_readonly ./cmd/youtrack-agent-cli; then
            echo "::error::identity tag built on a non-Darwin runner"
            exit 1
          fi

      # The same boundary the release workflow verifies, so a regression shows
      # before a tag is cut.
      - name: Portable read-only boundary
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          go test -tags portable_readonly ./...
          test -z "$(go list -tags portable_readonly -deps ./cmd/youtrack-agent-cli | grep -E '/internal/(auth|application|journal|mutation|operatorwrite|youtrack)$' || true)"
          go build -tags portable_readonly -o "${RUNNER_TEMP}/portable-readonly" ./cmd/youtrack-agent-cli
          "${RUNNER_TEMP}/portable-readonly" --help | grep -Eq '^  profile +Manage non-secret read-only Remote MCP profiles$'
          ! "${RUNNER_TEMP}/portable-readonly" --help | grep -Eiq 'auth|inspect|mutation|operator-write'

      - name: Gate 1A cross-language protocol tests
        if: runner.os == 'macOS'
        run: swift test --package-path native/macos/ApprovalProtocol

      - name: Homebrew offline-readiness rehearsal
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # Staging is the only network-capable phase. homebrewcheck verifies
          # these proxy zips, creates vendor metadata from them, and performs
          # the actual CGO build with GOPROXY/GOSUMDB disabled and empty caches.
          go mod download
          go run ./tools/homebrewcheck \
            --proxy-dir "$(go env GOMODCACHE)/cache/download" \
            --build

      # -race is not optional here: the client paces and retries from shared
      # state, and a data race there would surface as a wrong rate-limit
      # decision rather than a crash.
      - name: go test
        run: go test -race ./...

      # Running the built binary catches an -X flag that silently sets nothing.
      - name: goreleaser check and portable build rehearsal
        if: runner.os == 'Linux'
        env:
          GOTOOLCHAIN: auto
          CLI_VERSION: 0.0.0
        run: |
          set -euo pipefail
          go install github.com/goreleaser/goreleaser/v2@v2.17.1
          goreleaser check
          goreleaser build --snapshot --clean --id portable-readonly
          binary="$(ls -d dist/portable-readonly_linux_amd64*/)youtrack-agent-cli"
          test "$("${binary}" version -o json | jq -r '.data.version')" = "${CLI_VERSION}"

      # The generated contract is what agents read. If regenerating changes it,
      # the committed copy no longer matches internal/errx.
      - name: Generated contract is current
        run: |
          go generate ./...
          DIRTY=$(git status --porcelain)
          if [ -n "$DIRTY" ]; then
            echo "::error::go generate changed tracked files; commit the result:"
            echo "$DIRTY"
            git diff
            exit 1
          fi

  youtrack-windows:
    name: youtrack-agent-cli Windows fail-closed safety
    needs: changes
    if: needs.changes.outputs.youtrack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: youtrack-agent-cli
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: youtrack-agent-cli/go.mod
          cache: true
          cache-dependency-path: youtrack-agent-cli/go.sum

      - name: Skill mutation fails closed
        run: go test -race -run '^TestWindowsSkillMutationFailsClosed$' ./internal/skills

      - name: Journal migration fails closed
        run: go test -race -run '^TestStoreMigratePreparedV1Windows' ./internal/journal

      - name: Build unsupported credential backend
        run: go build ./cmd/youtrack-agent-cli

  # The one required check. It runs after every other job, whatever their
  # results, so a skipped or failed job can never read as a pass.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, repo, youtrack, youtrack-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REPO_RESULT: ${{ needs.repo.result }}
          YOUTRACK_RESULT: ${{ needs.youtrack.result }}
          WINDOWS_RESULT: ${{ needs.youtrack-windows.result }}
          YOUTRACK_SELECTED: ${{ needs.changes.outputs.youtrack }}
          ALL_SELECTED: ${{ needs.changes.outputs.all }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          [ "${CHANGES_RESULT}" = success ] || fail "changes=${CHANGES_RESULT}"
          [ "${REPO_RESULT}" = success ] || fail "repo=${REPO_RESULT}"
          case "${YOUTRACK_SELECTED}:${ALL_SELECTED}" in
            true:true | true:false | false:true | false:false) ;;
            *) fail "malformed selection: youtrack=${YOUTRACK_SELECTED} all=${ALL_SELECTED}" ;;
          esac
          expected=skipped
          if [ "${YOUTRACK_SELECTED}" = true ] || [ "${ALL_SELECTED}" = true ]; then
            expected=success
          fi
          [ "${YOUTRACK_RESULT}" = "${expected}" ] || fail "youtrack=${YOUTRACK_RESULT}, expected ${expected}"
          [ "${WINDOWS_RESULT}" = "${expected}" ] || fail "youtrack-windows=${WINDOWS_RESULT}, expected ${expected}"
