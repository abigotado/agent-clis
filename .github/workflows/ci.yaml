name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  changes:
    name: Select affected modules
    runs-on: ubuntu-latest
    outputs:
      youtrack: ${{ steps.select.outputs.youtrack }}
      core: ${{ steps.select.outputs.core }}
      clis: ${{ steps.select.outputs.clis }}
      all: ${{ steps.select.outputs.all }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select jobs from the changed paths
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/ci-changes.sh

  repo:
    name: Repository layout, workflows, and harness
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: youtrack-agent-cli/go.mod
          cache: true
          cache-dependency-path: youtrack-agent-cli/go.sum

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Pinned so a runner image bump cannot silently change the interpreter
          # the harness scripts run on.
          python-version: "3.12"

      # A Deprecated line on a current module would tell every consumer to
      # leave it. The old path carries one; the new paths must not.
      - name: No tracked module is deprecated
        run: |
          set -euo pipefail
          modules="$(git ls-files -- go.mod '*/go.mod')"
          test -n "${modules}"
          while IFS= read -r module; do
            deprecated="$(go mod edit -json "${module}" | jq -r '.Module.Deprecated // empty')"
            if [ -n "${deprecated}" ]; then
              echo "::error::${module} declares Deprecated: ${deprecated}"
              exit 1
            fi
          done <<<"${modules}"

      - name: Repository layout
        run: |
          set -euo pipefail
          test ! -e go.mod
          test -z "$(git ls-files -- go.work go.work.sum)"
          test -f docs/oauth-errors.md
          cmp LICENSE youtrack-agent-cli/LICENSE

      # Validate workflow expressions and every shell block. Pinned so an
      # unrelated pull request cannot turn red because a linter changed itself.
      - name: actionlint
        run: |
          set -euo pipefail
          # actionlint falls back to workflow-syntax-only when shellcheck is
          # missing, and reports success having checked no shell at all.
          # ubuntu-latest ships it; assert that rather than assume it, because
          # the failure mode is silent loss of coverage.
          if ! command -v shellcheck >/dev/null; then
            echo "::error::shellcheck is not installed; actionlint would skip every run: block"
            exit 1
          fi
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint

      - name: Release policy and change selection
        run: |
          set -euo pipefail
          ruby .github/scripts/verify-portable-release-policy_test.rb
          ruby .github/scripts/verify-portable-release-policy.rb youtrack-agent-cli/.goreleaser.yaml .
          ruby .github/scripts/ci-changes_test.rb
          bash .github/scripts/pre-push_test.sh

      - name: Core hygiene check tests
        run: ruby .github/scripts/core-hygiene_test.rb

      - name: Generated mirrors must stay untracked
        run: |
          TRACKED=$(git ls-files .claude .codex)
          if [ -n "$TRACKED" ]; then
            echo "::error::Generated provider mirrors are committed. Remove them:"
            echo "$TRACKED"
            exit 1
          fi

      - name: Cursor mirrors are in sync
        run: python3 .agents/scripts/sync-rules.py --check

      - name: Harness unit tests
        run: python3 -m unittest discover -s .agents/tests -p 'test_*.py'

      # The provider compiler is not vendored — it lives in the machine-local
      # global harness, which a runner does not have. Compile determinism is
      # therefore a local pre-push check, not a CI check. What CI can still
      # enforce is that nobody vendored it back in without the duplication that
      # decision implies.
      - name: Provider compiler must stay unvendored
        run: |
          if [ -e .agents/scripts/compiler.py ]; then
            echo "::error::.agents/scripts/compiler.py is committed. The provider"
            echo "::error::compiler is intentionally the global ~/.agents one; see"
            echo "::error::.agents/README.md."
            exit 1
          fi

  # core/ is shared by every CLI, so its job is not selected by path: it runs
  # on every change and is not skippable.
  core-unit:
    name: core (unit tests, static checks, dependency closure)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Needs the full history: the commit messages of the pull request range
      # are scanned together with the tracked files under core/.
      - name: Hygiene
        run: ../.github/scripts/core-hygiene.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      # setup-go sets GOTOOLCHAIN=local, so a toolchain line it did not honour
      # would silently test on another Go. Compare with the line itself.
      - name: Go toolchain matches go.mod
        run: |
          set -euo pipefail
          want="$(sed -n 's/^toolchain //p' go.mod)"
          test -n "${want}"
          go version
          go version | grep -Fq " ${want} "

      - name: gofmt
        run: |
          UNFORMATTED=$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$UNFORMATTED"
            exit 1
          fi

      # Platform backends are build-tagged, so vet each target: a linux-only
      # runner would never compile the darwin or windows files.
      - name: go vet on every target OS
        run: |
          set -euo pipefail
          for target_os in linux darwin windows; do
            echo "go vet GOOS=${target_os}"
            GOOS="${target_os}" go vet ./...
          done

      - name: Verify module checksums
        run: go mod verify

      - name: go test
        run: go test -race ./...

      - name: go test without cgo
        run: CGO_ENABLED=0 go test ./...

      - name: Vulnerability scan
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          for target_os in linux darwin windows; do
            echo "govulncheck GOOS=${target_os}"
            GOOS="${target_os}" govulncheck ./...
          done

      # v0.8.2 (staticcheck 2026.2.2) declares go 1.26.0 and analyses Go 1.27.
      - name: staticcheck on every target OS
        run: |
          set -euo pipefail
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          for target_os in linux darwin windows; do
            echo "staticcheck GOOS=${target_os}"
            GOOS="${target_os}" staticcheck ./...
          done

      # core must stay a leaf: no CLI module, and outside the standard library
      # only the two packages the platform backends need.
      - name: Dependency closure
        run: |
          set -euo pipefail
          allowed="$(printf '%s\n' github.com/abigotado/agent-clis/core golang.org/x/sys github.com/godbus/dbus/v5 | LC_ALL=C sort)"
          # Both cgo settings: darwin && cgo and darwin && !cgo select different files.
          for cgo in 0 1; do for target_os in linux darwin windows; do
            modules="$(CGO_ENABLED="${cgo}" GOOS="${target_os}" go list -deps -test -f '{{if not .Standard}}{{with .Module}}{{.Path}}{{else}}no-module:{{.ImportPath}}{{end}}{{end}}' ./... | awk 'NF' | LC_ALL=C sort -u)"
            test -n "${modules}"
            unexpected="$(LC_ALL=C comm -23 <(printf '%s\n' "${modules}") <(printf '%s\n' "${allowed}"))"
            if [ -n "${unexpected}" ]; then
              echo "::error::core depends on modules outside the allowed set for GOOS=${target_os} CGO_ENABLED=${cgo}:"
              echo "${unexpected}"
              exit 1
            fi
          done; done

  # The cgo Security.framework backend only compiles on macOS, so it needs its
  # own runner. Selected like a CLI job: when core or everything changed.
  core-macos:
    name: core (macOS keychain backend)
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.all == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      # setup-go sets GOTOOLCHAIN=local, so a toolchain line it did not honour
      # would silently test on another Go. Compare with the line itself.
      - name: Go toolchain matches go.mod
        run: |
          set -euo pipefail
          want="$(sed -n 's/^toolchain //p' go.mod)"
          test -n "${want}"
          go version
          go version | grep -Fq " ${want} "

      # Without these checks a runner that silently dropped cgo, or a build
      # constraint typo, would pass every test while skipping the backend.
      - name: Backend files are selected for the right build
        run: |
          set -euo pipefail
          cgo_files="$(go list -f '{{join .CgoFiles " "}}' ./secretstore)"
          echo "cgo build, CgoFiles: ${cgo_files}"
          case " ${cgo_files} " in
            *" keychain_darwin.go "*) ;;
            *) echo "::error::keychain_darwin.go is not compiled with cgo enabled"; exit 1 ;;
          esac
          go_files="$(CGO_ENABLED=0 go list -f '{{join .GoFiles " "}}' ./secretstore)"
          echo "no-cgo build, GoFiles: ${go_files}"
          case " ${go_files} " in
            *" open_darwin_nocgo.go "*) ;;
            *) echo "::error::open_darwin_nocgo.go is not compiled with cgo disabled"; exit 1 ;;
          esac

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: go test without cgo
        run: CGO_ENABLED=0 go test ./...

      - name: go vet with the integration tag
        run: go vet -tags keychainintegration ./...

      # Runs the real keychain backend against a scratch keychain created in a
      # temporary directory, outside the user's search list; the login keychain
      # is never reached. With the variable set, a runner that cannot create
      # one fails the job instead of skipping. A skipped or unmatched test
      # still exits 0, so each required test must also report PASS.
      - name: Keychain integration
        env:
          SECRETSTORE_REQUIRE_KEYCHAIN: "1"
        run: |
          set -euo pipefail
          log="$(mktemp)"
          go test -race -count=1 -timeout 20m -v -tags keychainintegration ./secretstore/... 2>&1 | tee "${log}"
          # TestKeychainHelper, TestInteractionScopeHelper and TestInjectionHelper
          # are left out on purpose: each is the helper child process of another
          # test and skips when run directly.
          for name in TestKeychainScratch TestKeychainAcrossBinaries TestInteractionFlagScope TestHardenedRuntimeRefusesInjection TestKeychainSaveInReadOnlySandbox TestKeychainSaveInReadOnlySandbox/Save_under_a_profile_that_denies_writes_to_the_keychain_is_read-only TestKeychainSaveInReadOnlySandbox/control:_the_open-only_helper_saves_without_a_sandbox; do
            grep -Fq -- "--- PASS: ${name} " "${log}" || { echo "::error::${name} did not pass"; exit 1; }
          done

  # Credential Manager exists only on Windows, so the real backend needs its
  # own runner. Selected like core-macos. bash is the default shell so the
  # steps match the Linux and macOS jobs; the integration run must not skip.
  core-windows:
    name: core (Windows Credential Manager backend)
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.all == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      # setup-go sets GOTOOLCHAIN=local, so a toolchain line it did not honour
      # would silently test on another Go. Compare with the line itself.
      - name: Go toolchain matches go.mod
        run: |
          set -euo pipefail
          want="$(sed -n 's/^toolchain //p' go.mod)"
          test -n "${want}"
          go version
          go version | grep -Fq " ${want} "

      - name: go vet
        run: go vet ./...

      - name: go vet with the integration tag
        run: go vet -tags credmanintegration ./...

      - name: go test
        run: go test -race ./...

      # The CREDENTIALW layout differs on 32-bit Windows, and no later step
      # builds for it. These two tests are pure Go, so the 386 binary runs on
      # the amd64 runner. The race detector needs cgo, which a 386 build here
      # has no toolchain for, so it is off. A -run that matched nothing would
      # still pass, so each test must report PASS.
      - name: Credential layout on 32-bit Windows
        env:
          GOARCH: "386"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          out="$(go test -count=1 -v -run '^(TestCredentialLayout|TestWin32CodesMatchTheSystem)$' ./secretstore/)"
          printf '%s\n' "${out}"
          for name in TestCredentialLayout TestWin32CodesMatchTheSystem; do
            grep -Fq -- "--- PASS: ${name} " <<<"${out}"
          done

      # Runs against this runner's real Credential Manager, under random
      # secretstore-test-<hex> targets that the tests delete. With the variable
      # set, an unusable Credential Manager fails the job instead of skipping.
      # Each required test must also report PASS, so a skip cannot pass.
      - name: Credential Manager integration
        env:
          SECRETSTORE_REQUIRE_CREDMAN: "1"
        run: |
          set -euo pipefail
          log="$(mktemp)"
          go test -race -count=1 -v -tags credmanintegration ./secretstore/... 2>&1 | tee "${log}"
          for name in TestCredmanContract TestCredmanChunkBoundaries TestCredmanServiceBlobLimit; do
            grep -Fq -- "--- PASS: ${name} " "${log}" || { echo "::error::${name} did not pass"; exit 1; }
          done

  core-linux:
    name: core (Linux Secret Service backend)
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      # setup-go sets GOTOOLCHAIN=local, so a toolchain line it did not honour
      # would silently test on another Go. Compare with the line itself.
      - name: Go toolchain matches go.mod
        run: |
          set -euo pipefail
          want="$(sed -n 's/^toolchain //p' go.mod)"
          test -n "${want}"
          go version
          go version | grep -Fq " ${want} "

      # The packages are not pinned, so the provider can change between runs.
      # The tests start their own dbus-daemon and gnome-keyring-daemon and
      # never use the runner's session bus.
      - name: Install the Secret Service provider
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus

      - name: go vet
        run: go vet ./...

      - name: go vet with the integration tag
        run: go vet -tags secretserviceintegration ./...

      # Runs against a private bus and keyring the tests create in a temporary
      # directory. With the variable set, a missing daemon fails the job
      # instead of skipping. Each required test must also report PASS, so a
      # skip cannot pass.
      - name: Secret Service integration
        env:
          SECRETSTORE_REQUIRE_SECRET_SERVICE: "1"
        run: |
          set -euo pipefail
          log="$(mktemp)"
          go test -race -count=1 -v -tags secretserviceintegration ./secretstore/... 2>&1 | tee "${log}"
          for name in TestSecretServiceContract TestSecretServiceContractPlain TestSecretServiceUsesDH TestSecretServiceLocked TestSecretServiceNoProvider TestSecretServiceOpen; do
            grep -Fq -- "--- PASS: ${name} " "${log}" || { echo "::error::${name} did not pass"; exit 1; }
          done

  # Builds and tests each CLI against the local core/ instead of the core
  # version its go.mod pins, so a change to core cannot break a CLI unseen.
  # The list of CLIs comes from the changes job (every registered module but
  # core). The job runs when core or a CLI changed; with one CLI the youtrack
  # flag is that CLI's own selection. No CLI imports core yet (that is M6), so
  # today this only proves the two modules compose into one workspace; it
  # starts to catch API breaks with the first import. Blocking by design: there
  # is no label to excuse a break. go.work is created here and never committed.
  core-compat:
    name: core compat (${{ matrix.cli }}, ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.youtrack == 'true' || needs.changes.outputs.all == 'true'
    strategy:
      fail-fast: false
      matrix:
        cli: ${{ fromJSON(needs.changes.outputs.clis) }}
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 30 || 20 }}
    env:
      GOWORK: ${{ github.workspace }}/go.work
    defaults:
      run:
        shell: bash
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.cli }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.cli }}/go.sum

      - name: Create the workspace
        env:
          CLI: ${{ matrix.cli }}
        run: |
          set -euo pipefail
          go work init ./core "./${CLI}"
          cat go.work

      - name: go build
        working-directory: ${{ matrix.cli }}
        run: go build ./...

      - name: go vet
        working-directory: ${{ matrix.cli }}
        run: go vet ./...

      - name: go test
        working-directory: ${{ matrix.cli }}
        run: go test -race ./...

  youtrack:
    name: youtrack-agent-cli (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.youtrack == 'true' || needs.changes.outputs.all == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: youtrack-agent-cli
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: youtrack-agent-cli/go.mod
          cache: true
          cache-dependency-path: youtrack-agent-cli/go.sum

      - name: gofmt
        run: |
          UNFORMATTED=$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Verify module checksums
        run: go mod verify

      - name: Vulnerability scan
        if: runner.os == 'Linux'
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: go build
        run: go build ./...

      - name: Registry and receipt fixture provenance
        run: |
          go run ./testdata/gate1a-registry/generate.go -check
          go run ./testdata/gate1a-registry-intent/generate.go -check
          go run ./testdata/gate1a-registry-active/generate.go -check
          go run ./testdata/gate1a-registry-closed/generate.go -check
          go run ./testdata/gate1a-registry-time/generate.go -check
          go run ./testdata/gate1a-v3/generate.go -check

      - name: Darwin credential backend build modes
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go build -o "${RUNNER_TEMP}/youtrack-agent-cli-native" ./cmd/youtrack-agent-cli
          CGO_ENABLED=1 go list -f '{{join .CgoFiles "\n"}}' ./internal/auth \
            | grep -Fxq 'keychain_darwin.go'
          otool -L "${RUNNER_TEMP}/youtrack-agent-cli-native" | grep -Fq '/Security.framework/'
          if grep -aFq '/usr/bin/security' "${RUNNER_TEMP}/youtrack-agent-cli-native"; then
            echo "::error::native Darwin binary contains the forbidden security subprocess path"
            exit 1
          fi
          CGO_ENABLED=0 go build -o "${RUNNER_TEMP}/youtrack-agent-cli-unsupported" ./cmd/youtrack-agent-cli
          CGO_ENABLED=0 go list -f '{{join .GoFiles "\n"}}' ./internal/auth \
            | grep -Fxq 'keychain_unsupported.go'

      - name: macOS identity-only developer build modes
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          IDENTITY_TAG=macos_identity_readonly
          IDENTITY_BINARY="${RUNNER_TEMP}/youtrack-agent-cli-identity"
          CGO_ENABLED=1 go vet -tags "${IDENTITY_TAG}" \
            ./cmd/youtrack-agent-cli ./internal/readonlycli ./internal/skills ./assets ./internal/profile
          CGO_ENABLED=1 go test -race -tags "${IDENTITY_TAG}" \
            ./cmd/youtrack-agent-cli ./internal/readonlycli ./internal/skills ./assets ./internal/profile
          CGO_ENABLED=1 go build -tags "${IDENTITY_TAG}" -o "${IDENTITY_BINARY}" ./cmd/youtrack-agent-cli

          EXPECTED_OWNED_DEPS='github.com/abigotado/agent-clis/youtrack-agent-cli/assets
          github.com/abigotado/agent-clis/youtrack-agent-cli/cmd/youtrack-agent-cli
          github.com/abigotado/agent-clis/youtrack-agent-cli/internal/endpoint
          github.com/abigotado/agent-clis/youtrack-agent-cli/internal/errx
          github.com/abigotado/agent-clis/youtrack-agent-cli/internal/lockfile
          github.com/abigotado/agent-clis/youtrack-agent-cli/internal/output
          github.com/abigotado/agent-clis/youtrack-agent-cli/internal/profile
          github.com/abigotado/agent-clis/youtrack-agent-cli/internal/protocolvalue
          github.com/abigotado/agent-clis/youtrack-agent-cli/internal/readonlycli
          github.com/abigotado/agent-clis/youtrack-agent-cli/internal/skills'
          ACTUAL_OWNED_DEPS=$(go list -tags "${IDENTITY_TAG}" -deps ./cmd/youtrack-agent-cli \
            | grep '^github.com/abigotado/agent-clis/youtrack-agent-cli/' \
            | sort)
          if [ "${ACTUAL_OWNED_DEPS}" != "${EXPECTED_OWNED_DEPS}" ]; then
            echo "::error::identity owned dependency closure changed"
            printf 'expected:\n%s\nactual:\n%s\n' "${EXPECTED_OWNED_DEPS}" "${ACTUAL_OWNED_DEPS}"
            exit 1
          fi
          # Cobra/pflag transitively imports net for optional IP flag types,
          # even though this command never registers one. Forbid network
          # imports at the owned-package boundary so no identity package can
          # add transport capability through that dependency.
          for OWNED_PACKAGE in ${EXPECTED_OWNED_DEPS}; do
            for FORBIDDEN_IMPORT in net net/http crypto/tls; do
              if go list -tags "${IDENTITY_TAG}" -f '{{join .Imports "\n"}}' "${OWNED_PACKAGE}" | grep -Fxq "${FORBIDDEN_IMPORT}"; then
                echo "::error::identity package ${OWNED_PACKAGE} directly imports ${FORBIDDEN_IMPORT}"
                exit 1
              fi
            done
          done
          if otool -L "${IDENTITY_BINARY}" | grep -Fq '/Security.framework/'; then
            echo "::error::identity binary links Security.framework"
            exit 1
          fi
          if CGO_ENABLED=0 go build -tags "${IDENTITY_TAG}" ./cmd/youtrack-agent-cli; then
            echo "::error::identity tag built without Darwin cgo support"
            exit 1
          fi
          if CGO_ENABLED=1 go build -tags 'portable_readonly macos_identity_readonly' ./cmd/youtrack-agent-cli; then
            echo "::error::portable and identity tags built together"
            exit 1
          fi

      - name: Linux rejects macOS identity-only edition
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if CGO_ENABLED=1 go build -tags macos_identity_readonly ./cmd/youtrack-agent-cli; then
            echo "::error::identity tag built on a non-Darwin runner"
            exit 1
          fi

      # The same boundary the release workflow verifies, so a regression shows
      # before a tag is cut.
      - name: Portable read-only boundary
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          go test -tags portable_readonly ./...
          deps="$(go list -tags portable_readonly -deps ./cmd/youtrack-agent-cli)"
          test -n "${deps}"
          rc=0
          forbidden="$(grep -E '^net/http(/|$)|/internal/(approval|auth|application|intent|journal|mutation|oauth|oauthrecovery|operatorwrite|writepolicy|youtrack)(/|$)' <<<"${deps}")" || rc=$?
          test "${rc}" -le 1
          if [ -n "${forbidden}" ]; then echo "portable build links forbidden packages:" >&2; echo "${forbidden}" >&2; exit 1; fi
          go build -tags portable_readonly -o "${RUNNER_TEMP}/portable-readonly" ./cmd/youtrack-agent-cli
          "${RUNNER_TEMP}/portable-readonly" --help | grep -Eq '^  profile +Manage non-secret read-only Remote MCP profiles$'
          ! "${RUNNER_TEMP}/portable-readonly" --help | grep -Eiq 'auth|inspect|mutation|operator-write'

      - name: Gate 1A cross-language protocol tests
        if: runner.os == 'macOS'
        run: swift test --package-path native/macos/ApprovalProtocol

      - name: Homebrew offline-readiness rehearsal
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # Staging is the only network-capable phase. homebrewcheck verifies
          # these proxy zips, creates vendor metadata from them, and performs
          # the actual CGO build with GOPROXY/GOSUMDB disabled and empty caches.
          go mod download
          go run ./tools/homebrewcheck \
            --proxy-dir "$(go env GOMODCACHE)/cache/download" \
            --build

      # -race is not optional here: the client paces and retries from shared
      # state, and a data race there would surface as a wrong rate-limit
      # decision rather than a crash.
      - name: go test
        run: go test -race ./...

      # Running the built binary catches an -X flag that silently sets nothing.
      - name: goreleaser check and portable build rehearsal
        if: runner.os == 'Linux'
        env:
          GOTOOLCHAIN: auto
          CLI_VERSION: 0.0.0
        run: |
          set -euo pipefail
          go install github.com/goreleaser/goreleaser/v2@v2.17.1
          goreleaser check --config .goreleaser.yaml
          goreleaser build --config .goreleaser.yaml --snapshot --clean --id portable-readonly
          binary="$(ls -d dist/portable-readonly_linux_amd64*/)youtrack-agent-cli"
          test "$("${binary}" version -o json | jq -r '.data.version')" = "${CLI_VERSION}"

      # The generated contract is what agents read. If regenerating changes it,
      # the committed copy no longer matches internal/errx.
      - name: Generated contract is current
        run: |
          go generate ./...
          DIRTY=$(git status --porcelain)
          if [ -n "$DIRTY" ]; then
            echo "::error::go generate changed tracked files; commit the result:"
            echo "$DIRTY"
            git diff
            exit 1
          fi

  youtrack-windows:
    name: youtrack-agent-cli Windows fail-closed safety
    needs: changes
    if: needs.changes.outputs.youtrack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: youtrack-agent-cli
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: youtrack-agent-cli/go.mod
          cache: true
          cache-dependency-path: youtrack-agent-cli/go.sum

      - name: Skill mutation fails closed
        run: go test -race -run '^TestWindowsSkillMutationFailsClosed$' ./internal/skills

      - name: Journal migration fails closed
        run: go test -race -run '^TestStoreMigratePreparedV1Windows' ./internal/journal

      - name: Build unsupported credential backend
        run: go build ./cmd/youtrack-agent-cli

  # The one required check. It runs after every other job, whatever their
  # results, so a skipped or failed job can never read as a pass.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, repo, core-compat, core-unit, core-linux, core-macos, core-windows, youtrack, youtrack-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job
        env:
          NEEDS: ${{ toJSON(needs) }}
          YOUTRACK_SELECTED: ${{ needs.changes.outputs.youtrack }}
          CORE_SELECTED: ${{ needs.changes.outputs.core }}
          CLIS: ${{ needs.changes.outputs.clis }}
          ALL_SELECTED: ${{ needs.changes.outputs.all }}
        run: |
          set -euo pipefail
          for selection in "${YOUTRACK_SELECTED}" "${CORE_SELECTED}" "${ALL_SELECTED}"; do
            case "${selection}" in
              true | false) ;;
              *)
                echo "::error::malformed or empty selection: youtrack=${YOUTRACK_SELECTED} core=${CORE_SELECTED} all=${ALL_SELECTED}"
                exit 1
                ;;
            esac
          done
          # Every push and pull request selects at least one module; all flags
          # false means the selection step produced nothing.
          if [ "${YOUTRACK_SELECTED}" = false ] && [ "${CORE_SELECTED}" = false ] && [ "${ALL_SELECTED}" = false ]; then
            echo "::error::no module selected: youtrack=${YOUTRACK_SELECTED} core=${CORE_SELECTED} all=${ALL_SELECTED}"
            exit 1
          fi
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' <<<"${CLIS}" >/dev/null; then
            echo "::error::malformed or empty clis list: ${CLIS}"
            exit 1
          fi
          # The context must list exactly the jobs in needs above; a missing
          # job would otherwise drop out of the check below.
          if ! jq -e 'type == "object" and (keys == ["changes", "core-compat", "core-linux", "core-macos", "core-unit", "core-windows", "repo", "youtrack", "youtrack-windows"])' <<<"${NEEDS}" >/dev/null; then
            echo "::error::needs context does not list exactly changes, core-compat, core-linux, core-macos, core-unit, core-windows, repo, youtrack, youtrack-windows"
            exit 1
          fi
          # changes, repo and core-unit always run and must succeed. A selected
          # job (a CLI's, core-compat, core-linux, core-macos or core-windows) must succeed when its flag or all is
          # set, and must have been skipped otherwise: a job that ran
          # unselected, or was skipped when selected, means the selection and
          # the workflow disagree.
          youtrack_expected=skipped
          if [ "${YOUTRACK_SELECTED}" = true ] || [ "${ALL_SELECTED}" = true ]; then
            youtrack_expected=success
          fi
          core_expected=skipped
          if [ "${CORE_SELECTED}" = true ] || [ "${ALL_SELECTED}" = true ]; then
            core_expected=success
          fi
          # core-compat runs when core or a CLI changed.
          compat_expected=skipped
          if [ "${CORE_SELECTED}" = true ] || [ "${YOUTRACK_SELECTED}" = true ] || [ "${ALL_SELECTED}" = true ]; then
            compat_expected=success
          fi
          failures="$(jq -r --arg youtrack "${youtrack_expected}" --arg core "${core_expected}" --arg compat "${compat_expected}" '
            to_entries[]
            | .key as $job
            | .value.result as $result
            | (if $job == "core-compat" then $compat
               elif $job == "youtrack" or $job == "youtrack-windows" then $youtrack
               elif $job == "core-linux" or $job == "core-macos" or $job == "core-windows" then $core
               else "success" end) as $want
            | select($result != $want)
            | "\($job)=\($result) (want \($want))"
          ' <<<"${NEEDS}")"
          if [ -n "${failures}" ]; then
            echo "::error::jobs did not end as selected: ${failures//$'\n'/, }"
            exit 1
          fi
